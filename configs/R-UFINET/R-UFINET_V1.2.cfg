enable
configure terminal
hostname R-UFINET
ip domain-name ufinet.com
service password-encryption
username admin privilege 15 secret PRONET_2026
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ipv6 unicast-routing
interface Loopback0
 description INTERNET_SIMULATION_GOOGLE_DNS
 ip address 8.8.8.8 255.255.255.255
 ipv6 address 2001:4860:4860::8888/128
 no shutdown
 exit
interface GigabitEthernet0/0
 description ENLACE_WAN_HACIA_PRONET_CORE
 ip address 200.10.20.14 255.255.255.240
 ipv6 address 2001:DB8:FACE:FFFF::1/64
 no shutdown
 exit
interface GigabitEthernet0/1
 description ADMIN_SHUTDOWN_SECURITY_POLICY
 shutdown
 exit
interface GigabitEthernet0/2
 description ADMIN_SHUTDOWN_SECURITY_POLICY
 no ip address
 shutdown
 exit
line vty 0 4
 transport input ssh
 login local
 exit
end
write memory
show ip interface brief
show ipv6 interface brief
show cdp neighbors
show ip route connected