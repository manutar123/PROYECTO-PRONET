ip ssh version 2
banner motd ^
***********************************************************************
* PRONET ISP - ACCESO RESTRINGIDO A PERSONAL AUTORIZADO DE PRONET.    *
***********************************************************************
^
line con 0
 logging synchronous
 exit
line vty 0 4
 exec-timeout 5 0
 login local
 transport input ssh
 exit
ipv6 unicast-routing
interface Loopback0
 description ROUTER_ID_OSPF
 ip address 10.1.252.1 255.255.255.255
 ipv6 address 2001:DB8:FACE:FE::1/128
 ipv6 address fe80::1 link-local
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
 exit