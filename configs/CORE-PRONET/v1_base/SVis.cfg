enable
configure terminal
interface GigabitEthernet0/1/0
 description ENLACE_FISICO_WAN_UFINET
 switchport mode access
 switchport access vlan 130
 no shutdown
 exit
interface GigabitEthernet0/1/1
 description ENLACE_FISICO_WAN_STARLINK
 switchport mode access
 switchport access vlan 134
 no shutdown
 exit
interface Vlan130
 description SVI_GW_UFINET
 ip address 10.1.254.130 255.255.255.252
 ipv6 address 2001:DB8:FACE:30::130/126
 ipv6 address fe80::1 link-local
 no shutdown
 exit
interface Vlan134
 description SVI_GW_STARLINK
 ip address 10.1.254.134 255.255.255.252
 ipv6 address 2001:DB8:FACE:30::134/126
 ipv6 address fe80::1 link-local
 no shutdown
 exit
router ospf 1
 router-id 10.1.252.1
 passive-interface Vlan130
 passive-interface Vlan134
 exit
ipv6 router ospf 1
 router-id 10.1.252.1
 passive-interface Vlan130
 passive-interface Vlan134
 exit
ip route 0.0.0.0 0.0.0.0 10.1.254.129 1
ip route 0.0.0.0 0.0.0.0 10.1.254.133 10
ipv6 route ::/0 2001:DB8:FACE:30::129 1
ipv6 route ::/0 2001:DB8:FACE:30::133 10
end
write memory