! =====================================================================
! PLAN DE PRUEBAS Y VALIDACIÓN - CORE-PRONET v2.1
! Ejecutar desde el modo privilegiado (CORE-PRONET#)
! =====================================================================

! --- 1. VALIDACIÓN DE CAPA FÍSICA Y LÓGICA (INTERFACES Y VLANs) ---
show ip interface brief
show ipv6 interface brief

! --- 2. VALIDACIÓN DE ENRUTAMIENTO BÁSICO Y SALIDA WAN ---
show ip route static
show ipv6 route

! --- 3. VALIDACIÓN DE ENRUTAMIENTO DINÁMICO E INTERFACES PASIVAS ---
show ip ospf neighbor
show ip ospf interface brief
show ip protocols

! --- 4. VALIDACIÓN DE CRIPTOGRAFÍA, GESTIÓN Y ACCESO REMOTO ---
show ip ssh
show crypto key mypubkey rsa