enable
configure terminal
hostname R-UFINET
ip domain-name ufinet.com
service password-encryption
username admin privilege 15 secret PRONET_2026
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
interface Loopback0
 description INTERNET_SIMULATED_GOOGLE
 ip address 8.8.8.8 255.255.255.255
exit
interface GigabitEthernet0/0
 description ENLACE_TRANSPORTE_HACIA_PRONET_CORE
 ip address 172.20.20.1 255.255.255.252
 no shutdown
exit
line vty 0 4
 transport input ssh
 login local
exit
end
write